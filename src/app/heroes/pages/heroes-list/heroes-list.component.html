<nav class="navbar">
  <h2 class="navbar-title">Heroes list</h2>
  <a class="navbar-action" [routerLink]="['/heroes/add']">Add hero</a>
</nav>

<div class="heroes-list">
  @for (hero of heroes(); track hero.id) {
  <p>
    <a [routerLink]="['/heroes/detail', hero.id]">
      {{ hero.superhero }}
    </a>
    - {{ hero.publisher }}
  </p>
  } @empty {
  <p>No heroes found.</p>
  }
</div>
